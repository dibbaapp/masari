<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مساري | دليلك لاختيار التخصص</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ff; --surface:#ffffff; --surface-2:#f2effd; --line:#e7e2f8;
  --ink:#1f1a3d; --ink-2:#4c4770; --ink-3:#8a85a8;
  --brand:#6a4cff; --brand-2:#8467ff; --brand-soft:#efebff;
  --accent:#ff7a59; --accent-soft:#fff0eb;
  --ok:#12a874; --ok-soft:#e3f8ef; --warn:#e58e0b; --warn-soft:#fff4de; --bad:#e5484d; --bad-soft:#ffe9ea;
  --R:#ff7a59; --I:#3b82f6; --A:#b14cff; --S:#12b886; --E:#ffb020; --C:#5b6b8c;
  --grad:linear-gradient(135deg,#7c4dff 0%,#5a63ff 48%,#2fa8ff 100%);
  --grad-warm:linear-gradient(135deg,#ff7a59,#ff5fa2);
  --radius:24px; --shadow:0 2px 6px rgba(80,60,180,.06),0 14px 36px rgba(80,60,180,.10);
  --on-grad:#ffffff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#100d22; --surface:#1a1633; --surface-2:#231e42; --line:#322b57;
  --ink:#efeaff; --ink-2:#c2bce0; --ink-3:#8f88b3;
  --brand:#9b85ff; --brand-2:#b3a1ff; --brand-soft:#2a2350;
  --accent:#ff9677; --accent-soft:#3a231e;
  --ok:#3fd39b; --ok-soft:#163528; --warn:#ffb547; --warn-soft:#3a2c14; --bad:#ff7a7e; --bad-soft:#3c1d22;
  --grad:linear-gradient(135deg,#4f2fd6 0%,#3a43cf 50%,#1c7fd6 100%);
  --shadow:0 2px 6px rgba(0,0,0,.3),0 14px 36px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#100d22; --surface:#1a1633; --surface-2:#231e42; --line:#322b57;
  --ink:#efeaff; --ink-2:#c2bce0; --ink-3:#8f88b3;
  --brand:#9b85ff; --brand-2:#b3a1ff; --brand-soft:#2a2350;
  --accent:#ff9677; --accent-soft:#3a231e;
  --ok:#3fd39b; --ok-soft:#163528; --warn:#ffb547; --warn-soft:#3a2c14; --bad:#ff7a7e; --bad-soft:#3c1d22;
  --grad:linear-gradient(135deg,#4f2fd6 0%,#3a43cf 50%,#1c7fd6 100%);
  --shadow:0 2px 6px rgba(0,0,0,.3),0 14px 36px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Cairo",system-ui,"Segoe UI",Tahoma,sans-serif;line-height:1.7;font-size:16px;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
textarea.input{resize:vertical}
a{color:var(--brand)}

/* ===== الشريط العلوي المتدرج ===== */
.top{background:var(--grad);color:var(--on-grad);border-radius:0 0 40px 40px;padding:0 0 84px;position:relative;overflow:hidden}
.top::before,.top::after{content:"";position:absolute;border-radius:50%;pointer-events:none;background:rgba(255,255,255,.08)}
.top::before{width:420px;height:420px;top:-180px;inset-inline-start:-120px}
.top::after{width:260px;height:260px;bottom:-120px;inset-inline-end:8%}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(16px,4vw,40px);position:relative;z-index:1}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0 8px}
.logo{display:flex;align-items:center;gap:10px;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.logo-mark{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;color:#fff;backdrop-filter:blur(4px)}
.logo b{font-size:22px;display:block;line-height:1.1;font-weight:800}
.logo small{font-size:12px;opacity:.85;display:block}
.hdr-actions{display:flex;gap:6px;align-items:center}
.icon-btn{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.icon-btn:hover{background:rgba(255,255,255,.26)}
/* المحطات */
.stations{display:flex;gap:8px;padding:14px 6px 18px;margin:0 -6px -14px;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth}
.stations::-webkit-scrollbar{display:none}
.st{flex:none;display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;border-radius:999px;padding:6px 14px 6px 8px;background:rgba(255,255,255,.14);color:#fff;font-weight:600;font-size:14px;transition:.2s}
.st:hover{background:rgba(255,255,255,.24)}
.st .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.2);flex:none;position:relative}
.st .ic svg{width:16px;height:16px}
.st.on{background:#fff;color:#1f1a3d;box-shadow:0 8px 20px rgba(20,10,80,.25)}
.st.on .ic{background:var(--c);color:#fff}
.st.done .ic::after{content:"✓";position:absolute;bottom:-3px;inset-inline-end:-3px;width:15px;height:15px;border-radius:50%;background:#22c58b;color:#fff;font-size:9px;display:grid;place-items:center;border:2px solid #fff;line-height:1}
/* رأس الصفحة */
.page-head{padding:26px 0 0;max-width:760px}
.page-head .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;background:rgba(255,255,255,.18);padding:4px 14px 4px 6px;border-radius:999px;margin-bottom:10px}
.page-head .eyebrow i{width:24px;height:24px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-style:normal}
.page-head .eyebrow i svg{width:13px;height:13px;color:#fff}
h1{font-size:clamp(28px,3.8vw,42px);line-height:1.3;margin:0 0 8px;font-weight:800}
h2{font-size:22px;margin:0 0 6px;font-weight:800}
h3{font-size:17px;margin:0 0 4px;font-weight:700}
.lead{font-size:17px;margin:0;opacity:.92;max-width:720px}
.main{max-width:1180px;margin:-56px auto 0;padding:0 clamp(16px,4vw,40px) 80px;position:relative;z-index:2}

/* ===== المكونات ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);align-items:start}
.sticky{position:sticky;top:16px}
.muted{color:var(--ink-3)}
.small{font-size:13.5px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:11px 22px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:15px;transition:.18s}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 10px 24px rgba(90,80,255,.32)}
.btn.primary:hover{transform:translateY(-1px);color:#fff;box-shadow:0 14px 28px rgba(90,80,255,.38)}
.btn.ghost{background:none;border-color:transparent}
.btn.sm{padding:6px 14px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:28px;gap:12px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:700;color:var(--ink-2)}
.input,select.input{border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:11px 16px;width:100%;outline:none}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 20px;cursor:pointer;font-weight:700}
.seg button.on{background:var(--grad);color:#fff;border-color:transparent}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:2px 11px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.brand{background:var(--brand-soft);color:var(--brand)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.grade-card{text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:8px;font:inherit;color:inherit;transition:.18s;border-width:2px}
.grade-card:hover{transform:translateY(-3px);border-color:var(--c)}
.grade-card.on{border-color:var(--c)}
.grade-card .ic{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;color:#fff;background:var(--c)}
.grade-card .ic svg{width:24px;height:24px}
.filters.f4{grid-template-columns:2fr repeat(3,1fr)}
.rq-title{margin:2px 0 0;font-size:14px;color:var(--ink-2)}
.rq{display:flex;flex-direction:column;gap:2px}
.rq-row{display:grid;grid-template-columns:minmax(0,1fr) 150px 74px;gap:12px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14.5px;font-weight:600}
.rq-row:last-child{border-bottom:0}
.rq-row small{display:block;font-weight:500;font-size:12.5px}
.rq-row .track{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.rq-row .track i{display:block;height:100%;border-radius:99px;background:var(--c,var(--brand))}
.rq-row b{text-align:end;font-size:15.5px}
.rq-row b small{display:inline}
.rq-row.overall{color:var(--brand)}
.plan{width:100%;border-collapse:collapse;font-size:14px}
.plan th{text-align:start;color:var(--ink-3);padding:6px 8px 6px 0;font-weight:700}
.plan td{padding:8px 8px 8px 0;border-top:1px solid var(--line);vertical-align:top}
/* الرسائل */
.msg-back{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(24,16,70,.55);backdrop-filter:blur(5px);overflow:hidden}
.msg-back.show{display:flex;animation:msg-fade .22s ease}
.msg{position:relative;z-index:1;background:var(--surface);border-radius:28px;width:100%;max-width:560px;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 30px 70px rgba(20,10,80,.4);animation:msg-pop .38s cubic-bezier(.2,1.3,.4,1)}
.msg-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 26px;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#5a63ff))}
.msg-ic{width:60px;height:60px;border-radius:20px;background:rgba(255,255,255,.22);display:grid;place-items:center;color:#fff;animation:msg-bob 2.4s ease-in-out infinite}
.msg-ic svg{width:30px;height:30px}
.msg-in{padding:20px 26px 24px}
.msg-kicker{font-size:13.5px;font-weight:700;color:var(--c)}
.msg h2{font-size:clamp(21px,3.4vw,26px);line-height:1.45;margin:2px 0 8px}
.msg-body{margin:0;color:var(--ink-2);font-size:16px}
.msg-foot{margin:14px 0 0;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--c) 11%,transparent);font-weight:600;font-size:14.5px}
.msg-steps{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.msg-steps li{display:flex;gap:12px;align-items:flex-start;animation:msg-up .4s ease both}
.msg-steps .n{width:30px;height:30px;flex:none;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13.5px}
.msg-steps b{display:block;line-height:1.5}
.msg-steps small{color:var(--ink-3);font-size:13px;display:block;line-height:1.55}
.msg-envs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.msg-envs span{color:#fff;font-size:12.5px;font-weight:700;padding:3px 12px;border-radius:99px}
.msg-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px;text-align:center}
.msg-stats div{background:var(--surface-2);border-radius:16px;padding:10px 6px}
.msg-stats b{display:block;font-size:23px;font-weight:800;line-height:1.3}
.msg-stats small{color:var(--ink-3);font-size:12px;line-height:1.4;display:block}
.msg-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.confetti i{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;animation:msg-fall 2.6s linear both}
@keyframes msg-fade{from{opacity:0}}
@keyframes msg-pop{from{opacity:0;transform:translateY(24px) scale(.94)}}
@keyframes msg-up{from{opacity:0;transform:translateY(10px)}}
@keyframes msg-bob{50%{transform:translateY(-5px)}}
@keyframes msg-fall{to{top:105%;opacity:.7;rotate:520deg}}
@media (prefers-reduced-motion:reduce){.msg-back,.msg,.msg-ic,.msg-steps li{animation:none}.confetti{display:none}}
.sug{text-align:start;cursor:pointer;font:inherit;color:inherit;border-width:2px;transition:.18s;display:block}
.sug:hover{transform:translateY(-2px)}
.sug.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 7%,var(--surface))}
.sug h3,.sug .meta{display:flex}
.self-pick{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:18px}
/* البداية */
.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:24px;align-items:center;padding-top:20px}
.hero h1{font-size:clamp(32px,4.6vw,52px)}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.hero-cta .btn{border-color:transparent}
.hero-cta .btn.primary{background:#fff;color:#4b35d6;box-shadow:0 12px 26px rgba(20,10,80,.25)}
.hero-cta .btn.alt{background:rgba(255,255,255,.18);color:#fff}
.hero-art{width:100%;max-width:360px;justify-self:center}
.feature{display:flex;flex-direction:column;gap:10px}
.feature .ic{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;color:#fff;background:var(--c)}
.feature .ic svg{width:24px;height:24px}
.stat-strip{display:flex;gap:24px;flex-wrap:wrap;margin-top:22px;font-size:14px;opacity:.95}
.stat-strip b{font-size:22px;display:block;line-height:1.2;font-weight:800}
/* الميول */
.q{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px dashed var(--line)}
.q:last-child{border-bottom:0}
.q p{margin:0;font-weight:600}
.q .qn{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--surface-2);font-size:12px;margin-inline-end:8px;color:var(--ink-3);vertical-align:middle}
.likert{display:flex;gap:6px;flex:none}
.likert button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13.5px;font-weight:600;white-space:nowrap}
.likert button.on{background:var(--c,var(--brand));border-color:transparent;color:#fff}
.progress{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .3s}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:110px 1fr 44px;align-items:center;gap:12px;font-size:14.5px;font-weight:600}
.bar .track{height:14px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar .track i{display:block;height:100%;border-radius:99px}
.code-badge{display:flex;gap:8px}
.code-badge span{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;color:#fff;font-size:24px;font-weight:800;box-shadow:0 8px 18px rgba(0,0,0,.12)}
.env{border:1.5px solid var(--line);border-radius:18px;padding:14px;cursor:pointer;background:var(--surface);text-align:start;display:flex;flex-direction:column;gap:4px;font-weight:700}
.env.on{border-color:transparent;background:var(--c);color:#fff}
.env.on .dot{background:#fff!important}
.env b{display:flex;align-items:center;gap:8px}
/* المواد */
.subj-group{margin-bottom:18px}
.subj-group h4{margin:0 0 8px;font-size:14px;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:8px;transition:.15s}
.chip:hover{border-color:var(--c,var(--brand))}
.chip.on{background:var(--c,var(--brand));color:#fff;border-color:transparent;box-shadow:0 6px 14px rgba(0,0,0,.12)}
.rules{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.rules li{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:16px;font-size:14px}
.rules li.ok{background:var(--ok-soft)} .rules li.bad{background:var(--bad-soft)} .rules li.warn{background:var(--warn-soft)} .rules li.info{background:var(--surface-2)}
.rules .ic{flex:none;font-weight:800;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;margin-top:1px}
.rules li.ok .ic{background:var(--ok)} .rules li.bad .ic{background:var(--bad)} .rules li.warn .ic{background:var(--warn)} .rules li.info .ic{background:var(--ink-3)}
/* الدرجات */
.grade-row{display:grid;grid-template-columns:1fr 180px 76px;gap:14px;align-items:center;padding:11px 0;border-bottom:1px dashed var(--line)}
.grade-row:last-child{border-bottom:0}
.grade-row input[type=range]{width:100%;accent-color:var(--brand)}
.grade-row input[type=number]{text-align:center;padding:8px 6px;font-weight:700}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:32px;line-height:1.2;font-variant-numeric:tabular-nums;font-weight:800}
.stat small{color:var(--ink-3);font-size:13px;font-weight:600}
.stats .card{position:relative;overflow:hidden}
.stats .card::after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;inset-inline-end:-30px;top:-30px;background:var(--c);opacity:.14}
/* النتائج */
.tabs{display:inline-flex;gap:6px;background:var(--surface);border:1px solid var(--line);padding:6px;border-radius:999px;margin-bottom:18px;max-width:100%;overflow-x:auto;box-shadow:var(--shadow)}
.tabs button{border:0;background:none;padding:8px 18px;cursor:pointer;font-weight:700;color:var(--ink-3);border-radius:999px;white-space:nowrap}
.tabs button.on{background:var(--grad);color:#fff}
.filters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:10px;margin-bottom:16px}
.prog{display:flex;flex-direction:column;gap:10px;border-inline-start:6px solid var(--c,var(--brand))}
.prog-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.prog-head h3{font-size:17px;overflow-wrap:anywhere}
.prog-head>div:first-child{min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.code{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;color:var(--ink-3);direction:ltr;display:inline-block;background:var(--surface-2);padding:1px 8px;border-radius:8px}
.reqs{display:flex;flex-wrap:wrap;gap:6px}
.req{font-size:13px;padding:4px 12px;border-radius:999px;background:var(--surface-2);font-weight:600}
.req.ok{background:var(--ok-soft);color:var(--ok)}
.req.bad{background:var(--bad-soft);color:var(--bad)}
.req.warn{background:var(--warn-soft);color:var(--warn)}
.score{display:flex;gap:18px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--ink-2)}
.score b{color:var(--ink);font-variant-numeric:tabular-nums}
.star{border:0;background:var(--surface-2);cursor:pointer;font-size:20px;line-height:1;color:var(--ink-3);width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.star.on{color:#fff;background:var(--grad-warm)}
.path{display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.path::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--c)}
.path-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.path .fi{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:var(--c);color:#fff;flex:none}
.path .fi svg{width:22px;height:22px}
.ring{--p:50;width:66px;height:66px;border-radius:50%;background:conic-gradient(var(--c,var(--brand)) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.ring span{width:52px;height:52px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:800;font-size:14px}
.list{display:flex;flex-direction:column;gap:14px}
.empty{text-align:center;padding:40px 20px;color:var(--ink-3)}
.note{background:var(--accent-soft);border-radius:18px;padding:14px 18px;font-size:14px;color:var(--ink-2);border:1px dashed color-mix(in srgb,var(--accent) 40%,transparent)}
.fav-row{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line)}
.fav-row:last-child{border-bottom:0}
.rank{width:36px;height:36px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800}
.passport{border:0;border-radius:28px;padding:0;overflow:hidden}
.passport-head{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:24px 28px;background:var(--grad);color:#fff}
.passport-body{padding:24px 28px}
.toast{position:fixed;bottom:24px;inset-inline-start:50%;transform:translateX(50%);background:#1f1a3d;color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.show{opacity:1}
@media (max-width:980px){
  .hero{grid-template-columns:1fr}
  .hero-art{max-width:230px;order:-1}
  .split{grid-template-columns:1fr}
  .sticky{position:static}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .filters{grid-template-columns:1fr 1fr}
  .filters.f4{grid-template-columns:1fr 1fr}
  .filters .search{grid-column:1/-1}
  .st .lbl{display:none}
  .st{padding:6px}
  .st.on .lbl{display:inline}
  .st.on{padding:6px 14px 6px 8px}
  .hdr-actions .txt{display:none}
  .tabs{display:flex;width:100%}
  .tabs button{flex:1;padding:8px 10px;font-size:14px}
}
@media (max-width:620px){
  .top{border-radius:0 0 28px 28px;padding-bottom:72px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat b{font-size:24px}
  .q{flex-direction:column;align-items:stretch}
  .likert{justify-content:stretch}.likert button{flex:1;padding:6px 8px}
  .grade-row{grid-template-columns:1fr 70px}
  .grade-row input[type=range]{grid-column:1/-1;grid-row:2}
  .bar{grid-template-columns:86px 1fr 40px}
  .prog-head{flex-direction:column}
  .tabs{gap:2px}
  .tabs button{flex:1 1 auto;padding:8px 6px;font-size:12.5px}
  .rq-row{grid-template-columns:minmax(0,1fr) auto}
  .rq-row .track{display:none}
  .card{padding:18px;border-radius:20px}
  .passport-head,.passport-body{padding:18px}
}
@media print{
  .top,.nav,.no-print,.toast,.msg-back{display:none!important}
  .main{margin-top:0}
  body{background:#fff}
  .card{box-shadow:none}
  .passport-head{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

  const sum = {R:0,I:0,A:0,S:0,E:0,C:0}, max = {R:0,I:0,A:0,S:0,E:0,C:0};

  const vals = studentSubjects().map(k => gradeVal(k === 'math_adv' || k === 'math_basic' ? 'math' : k)).filter(v => v != null);
  return vals.length ? vals.reduce((a,b)=>a+b,0) / vals.length : null;
}

/* ضوابط اختيار المواد (ضوابط 2027/2028 واستمارة الصف الحادي عشر) */
function validateSubjects(set){
  const r = [];
  const sci = set.el.filter(x => SCIENCES.includes(x)), sk = set.el.filter(x => SKILLS.includes(x)), fl = set.el.filter(x => FOREIGN.includes(x));
  r.push(set.math ? {t:'ok', m:'اخترت مادة رياضيات واحدة ('+(set.math==='adv'?'المتقدمة':'الأساسية')+').'} : {t:'bad', m:'يلتزم الطالب بدراسة مادة واحدة من الرياضيات (الأساسية أو المتقدمة).'});
  r.push(set.el.length === 3 ? {t:'ok', m:'اخترت ثلاث مواد اختيارية.'} : {t:'bad', m:'يلتزم الطالب باختيار ثلاث مواد اختيارية (اخترت '+set.el.length+').'});
  r.push(sci.length ? {t:'ok', m:'اخترت '+sci.length+' من مواد العلوم.'} : {t:'bad', m:'يلتزم الطالب بدراسة مادة واحدة على الأقل من مواد العلوم (الأحياء، الفيزياء، الكيمياء، العلوم البيئية).'});
  if (sk.length > 1) r.push({t:'bad', m:'يحق للطالب اختيار مادة واحدة فقط من مواد المهارات الفردية.'});
  if (S.grade === '12') return r; // التنبيهات التالية تخص الانتقال من الحادي عشر إلى الثاني عشر
  if (fl.length > 1) r.push({t:'warn', m:'اخترت أكثر من لغة أجنبية. ستلتزم بدراسة اللغة التي تختارها في الصف الثاني عشر.'});
  if (fl.length) r.push({t:'info', m:'ستلتزم بدراسة '+fl.map(x=>SUBJECT_LABEL[x]).join(' و')+' في الصف الثاني عشر، ولا يمكن البدء بلغة أجنبية جديدة فيه.'});
  if (set.el.includes('it')) r.push({t:'info', m:'تقنية المعلومات: يمكنك تغييرها في الصف الثاني عشر، ولا يمكن دراستها فيه إن لم تُدرس في الحادي عشر.'});
  else r.push({t:'info', m:'تنبيه: لن تتمكن من دراسة تقنية المعلومات في الصف الثاني عشر إن لم تخترها الآن.'});
  if (sci.length === 1) r.push({t:'info', m:'اخترت مادة علوم واحدة؛ ستلتزم بدراستها في الصف الثاني عشر، ولا يمكن إضافة مادة علوم جديدة فيه.'});
  if (sci.length >= 2) r.push({t:'info', m:'يمكنك تغيير مادة علوم واحدة فقط في الصف الثاني عشر.'});
  return r;
}
function subjectsValid(){
  const rules = validateSubjects(curSet());
  return !rules.some(x => x.t === 'bad');
}

/* ============ مطابقة البرامج ============ */
function evaluate(p){
  const avg = overallAvg();
  const res = {status:'eligible', gaps:[], missing:[], chips:[], used:[], overallGap:0};
  if (p.g && S.gender && p.g !== S.gender) { res.status = 'gender'; }
  if (p.o) {
    const g = avg == null ? -Infinity : avg - p.o;
    res.chips.push({label:'المعدل العام '+p.o+'%', st: g >= 0 ? 'ok' : (g >= -5 ? 'warn':'bad'), v: avg});
    if (g < 0) res.overallGap = -g;
  }
  (p.r || []).forEach(grp => {
    const slots = grp.s.map(sl => {
      let best = null, key = null;
      sl.forEach(k => { const v = reqGrade(k); if (v != null && (best == null || v > best)) { best = v; key = k; } });
      return {sl, best, key, ok: best != null && best >= grp.m};
    });
    const okSlots = slots.filter(x => x.ok);
    okSlots.sort((x,y) => y.best - x.best).slice(0, grp.k).forEach(x => res.used.push(x.best));
    const label = sl => sl.map(k => SUBJECT_LABEL[k]).join(' أو ');
    if (okSlots.length >= grp.k) {
      slots.forEach(x => res.chips.push({label: label(x.sl)+' '+grp.m+'%', st: x.ok ? 'ok' : '', v:x.best}));
    } else {
      const need = grp.k - okSlots.length;
      const studied = slots.filter(x => !x.ok && x.best != null).sort((x,y) => y.best - x.best);
      const take = studied.slice(0, need);
      take.forEach(x => res.gaps.push({label: label(x.sl), need: grp.m, have: x.best, gap: grp.m - x.best}));
      if (take.length < need) res.missing.push({labels: slots.filter(x => x.best == null).map(x => label(x.sl)), n: need - take.length, of: grp.k, min: grp.m});
      slots.forEach(x => res.chips.push({label: label(x.sl)+' '+grp.m+'%', st: x.ok ? 'ok' : (x.best == null ? 'bad' : (grp.m - x.best <= 5 ? 'warn' : 'bad')), v:x.best}));
      if (grp.k < slots.length) res.chips.push({label:'(يكفي '+grp.k+' من '+slots.length+')', st:'note'});
    }
  });
  if (res.status !== 'gender') {
    const maxGap = Math.max(res.overallGap, ...res.gaps.map(g => g.gap), 0);
    if (res.missing.length) res.status = 'missing';
    else if (maxGap === 0) res.status = 'eligible';
    else if (maxGap <= 5) res.status = 'near';
    else res.status = 'below';
  }
  // المعدل التنافسي = 40% من معدل جميع المواد + 60% من معدل مواد البرنامج
  if (avg != null) {
    const prog = res.used.length ? res.used.reduce((a,b)=>a+b,0)/res.used.length : avg;
    res.comp = .4*avg + .6*prog;
  }
  return res;
}
let EVAL_CACHE = null;
function evalAll(){
  EVAL_CACHE = PROGRAMS.map(p => ({p, e: evaluate(p)}));
  return EVAL_CACHE;
}

  <div class="subj-group" style="--c:#6a4cff"><h4><span class="dot" style="background:#6a4cff"></span>الرياضيات (مادة واحدة إلزامية)</h4>
    <div class="chips">${[['basic','الرياضيات الأساسية'],['adv','الرياضيات المتقدمة']].map(([v,l])=>`<button class="chip ${set.math===v?'on':''}" data-math="${which}" data-val="${v}">${l}</button>`).join('')}</div>
  </div>
  ${ELECTIVE_GROUPS.map(g=>`<div class="subj-group" style="--c:${GROUP_COLOR[g.key]}"><h4><span class="dot" style="background:${GROUP_COLOR[g.key]}"></span>${g.label}</h4><div class="chips">${g.items.map(k=>{
    const on = set.el.includes(k);
    return `<button class="chip ${on?'on':''}" data-el="${which}" data-val="${k}">${SUBJECT_LABEL[k]}</button>`;}).join('')}</div></div>`).join('')}
  <div class="small muted">المواد الأساسية لجميع الطلبة: التربية الإسلامية، اللغة العربية، اللغة الإنجليزية، الرياضيات، هذا وطني.</div>`;
}
function rulesList(rules){ const ic = {ok:'✓', bad:'✕', warn:'!', info:'i'}; return `<ul class="rules">${rules.map(r=>`<li class="${r.t}"><span class="ic">${ic[r.t]}</span><span>${r.m}</span></li>`).join('')}</ul>`; }
function viewSubjects(){
  const is12 = S.grade === '12';
  return `
  ${eyebrow('subjects')}
  <h1>موادي تبني مساري</h1>
  <p class="lead">اختر مادة الرياضيات وثلاث مواد اختيارية. يتحقق النظام فوراً من ضوابط الاختيار.</p><!--/head-->
  <div class="grid split" id="subj-grid">
    <div class="grid">
      <div class="card"><h3>مواد ${GRADE_LABEL[S.grade]}</h3><div style="margin-top:12px">${subjectPicker(curSet(), is12?'g12':'g11')}</div></div>
    </div>
    <div class="grid sticky">
      <div class="card"><h3>التحقق من الضوابط</h3><div style="margin-top:10px">${rulesList(validateSubjects(curSet()))}</div></div>
    </div>
  </div>
  ${navButtons('me','grades','التالي: درجاتي', !subjectsValid())}`;
}

/* --- درجاتي --- */

  return `
  ${eyebrow('grades')}
  <h1>درجاتي</h1>
  <p class="lead">${S.grade==='12' ? 'أدخل درجاتك (أو المتوقعة) في مواد الصف الثاني عشر.' : 'أدخل درجاتك الحالية أو المتوقعة. سنستخدمها لتقدير التخصصات المتاحة لك في الصف الثاني عشر.'}</p><!--/head-->
  <div class="grid split" id="gr-grid">
    <div class="card">
      ${subs.map(k=>{const gk=keyOf(k), v=S.grades[gk]??''; return `<div class="grade-row">
        <label for="g-${gk}"><b>${SUBJECT_LABEL[k]}</b>${CORE.includes(k)||gk==='math'?' <span class="pill">أساسية</span>':''}</label>

    </div>
    <div class="grid sticky">
      <div class="card grid g2">
        <div class="stat"><small>المعدل العام</small><b id="avg-out">${fmt(avg)}${avg!=null?'%':''}</b></div>
        <div class="stat"><small>المواد المُدخلة</small><b>${filled.toLocaleString('ar-OM')} / ${subs.length.toLocaleString('ar-OM')}</b></div>
      </div>
      <div class="card small"><h3>كيف يُحسب المعدل التنافسي؟</h3>
        <p style="margin:6px 0 0">وفق دليل الطالب: <b>٤٠٪</b> من معدل جميع المواد + <b>٦٠٪</b> من معدل المواد التي يشترطها البرنامج. يحسبه «مساري» لكل برنامج تلقائياً.</p></div>
    </div>
  </div>
  ${navButtons('subjects','results','اعرض تخصصاتي', avg==null)}`;
}

/* --- تخصصاتي --- */
const STATUS = {
  eligible:{l:'مستوفٍ للشروط', c:'ok'}, near:{l:'قريب (ينقصك ٥٪ أو أقل)', c:'warn'},
  below:{l:'دون الحد الأدنى', c:'bad'}, missing:{l:'تنقصه مادة مطلوبة', c:'bad'}, gender:{l:'غير متاح لنوعك', c:'bad'}
};
function progCard(p, e){
  const fav = S.favs.includes(p.c);
  const st = STATUS[e.status];
  const why = [];
  if (e.overallGap) why.push('ينقصك '+fmt(e.overallGap)+'٪ في المعدل العام');
  e.gaps.forEach(g => why.push('ينقصك '+fmt(g.gap)+'٪ في '+g.label));
  e.missing.forEach(m => why.push('يتطلب دراسة '+m.labels.join(' أو ')));
  return `<article class="card prog" style="--c:${fcol(p.f)}">
    <div class="prog-head">
      <div>
        <h3>${esc(p.n)}</h3>
        <div class="meta">${metaPills(p)}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px"><span class="pill ${st.c}">${st.l}</span><button class="star ${fav?'on':''}" data-fav="${p.c}" title="${fav?'إزالة من رغباتي':'إضافة إلى رغباتي'}" aria-label="رغباتي">${fav?'★':'☆'}</button></div>
    </div>
    <div class="reqs">${e.chips.map(c => c.st==='note' ? `<span class="small muted">${c.label}</span>` : `<span class="req ${c.st}">${esc(c.label)}${c.v!=null?' · درجتك '+fmt(c.v):''}</span>`).join('') || '<span class="small muted">النجاح في دبلوم التعليم العام (راجع الدليل للتفاصيل)</span>'}</div>
    ${why.length ? `<div class="small" style="color:var(--bad)">${why.join(' · ')}</div>` : ''}
    <div class="score"><span>المعدل التنافسي التقديري: <b>${fmt(e.comp)}</b></span>${p.t&&p.t.length?`<span>حسم التعادل: ${p.t.map(k=>SUBJECT_LABEL[k]).join('، ')}</span>`:''}</div>
  </article>`;
}
const progMatches = (p, q) => !q || p.n.includes(q) || p.c.toLowerCase().includes(q.toLowerCase()) || (p.d||p.i).includes(q);
function filtered(all){
  const u = S.ui, q = u.q.trim();
  let list = all.filter(({p,e}) => {
    if (u.field && p.f !== u.field) return false;
    if (u.kind && p.k !== u.kind) return false;
    if (u.status === 'eligible' && e.status !== 'eligible') return false;
    if (u.status === 'near' && e.status !== 'near') return false;
    if (u.status === 'reach' && !['eligible','near'].includes(e.status)) return false;
    if (e.status === 'gender' && u.status !== 'all') return false;
    return progMatches(p, q);
  });
  const sorters = {
    comp:(a,b) => (b.e.comp??0) - (a.e.comp??0),
    req:(a,b) => (b.p.o??0) - (a.p.o??0),
  };
  return list.sort(sorters[u.sort] || sorters.comp);
}
function viewResults(){
  const all = evalAll(); const avg = overallAvg();
  const elig = all.filter(x => x.e.status === 'eligible'), near = all.filter(x => x.e.status === 'near');
  const missing = all.filter(x => x.e.status === 'missing');
  const tab = S.ui.tab;
  return `
  ${eyebrow('results')}
  <h1>تخصصاتي المقترحة</h1>
  <p class="lead">قارنّا موادك ودرجاتك بشروط ${PROGRAMS.length.toLocaleString('ar-OM')} برنامج في دليل الطالب، وهذه التخصصات المتاحة لك.</p><!--/head-->
  <div class="grid g4 stats" style="margin-bottom:20px">
    <div class="card stat" style="--c:#6a4cff"><small>المعدل العام</small><b>${fmt(avg)}%</b></div>
    <div class="card stat" style="--c:#12b886"><small>برامج مستوفٍ لشروطها</small><b style="color:var(--ok)">${elig.length.toLocaleString('ar-OM')}</b></div>
    <div class="card stat" style="--c:#ffb020"><small>برامج قريبة منك</small><b style="color:var(--warn)">${near.length.toLocaleString('ar-OM')}</b></div>
    <div class="card stat" style="--c:#ff5fa2"><small>برامج تتطلب مواد لم تدرسها</small><b>${missing.length.toLocaleString('ar-OM')}</b></div>
  </div>
  <div class="tabs no-print">${[['paths','المتاحة والمقترحة لك'],['list','جميع التخصصات'],['favs','رغباتي ('+S.favs.length.toLocaleString('ar-OM')+')']].map(([k,l])=>`<button class="${tab===k?'on':''}" data-tab="${k}">${l}</button>`).join('')}</div>
  ${tab==='paths' ? viewPaths(all) : tab==='favs' ? viewFavs(all) : viewList(all)}
  ${navButtons('grades','passport','التالي: جوازي')}`;
}
function viewPaths(all){
  const rows = FIELDS.map(f => {
    const items = all.filter(x => x.p.f === f.key);
    const el = items.filter(x => x.e.status === 'eligible'), nr = items.filter(x => x.e.status === 'near');
    const avail = el.length + .5*nr.length;
    return {f, items, el, nr, avail, pct: items.length ? Math.round(avail / items.length * 100) : 0};
  }).filter(r => r.avail).sort((a,b) => b.avail - a.avail);
  if (!rows.length) return `<div class="empty card">لا توجد برامج مستوفاة بعد بالدرجات المدخلة. راجع درجاتك، أو تصفّح جميع التخصصات لتعرف شروطها.<div style="margin-top:14px"><button class="btn primary" data-tab="list">جميع التخصصات</button></div></div>`;
  const cur = rows.find(r => r.f.key === S.ui.sug) || rows[0];
  const list = cur.el.concat(cur.nr).sort((a,b) => (a.e.status === b.e.status ? 0 : a.e.status === 'eligible' ? -1 : 1) || (b.e.comp??0) - (a.e.comp??0));
  const shown = list.slice(0, S.ui.limit || 40), meta = r => `<span class="pill ok">${r.el.length.toLocaleString('ar-OM')} مستوفٍ</span><span class="pill warn">${r.nr.length.toLocaleString('ar-OM')} قريب</span>`;
  return `<h2 style="margin:0 0 12px">المسارات الأكثر إتاحة لك</h2>
  <div class="grid g3">${rows.slice(0,3).map(r => sugCard(r, r === cur, true, r.pct, 'نسبة البرامج المتاحة لك في المسار', 'مقترح لك', meta(r))).join('')}</div>
  ${rows.length > 3 ? `<div class="chips" style="margin-top:14px"><span class="small muted">مسارات أخرى متاحة:</span>${rows.slice(3).map(r=>`<button class="chip ${r===cur?'on':''}" style="--c:${fcol(r.f.key)}" data-sug="${r.f.key}">${r.f.label} · ${r.el.length.toLocaleString('ar-OM')}</button>`).join('')}</div>` : ''}
  <h2 style="margin:26px 0 12px">برامج مسار ${cur.f.label} المتاحة لك</h2>
  <div class="list">${shown.map(x => progCard(x.p, x.e)).join('')}</div>
  ${moreBtn(list.length, shown.length)}
  <div class="card self-pick"><div><h3>تفضّل الاختيار بنفسك؟</h3><div class="small muted">تصفّح جميع برامج الدليل مع توضيح حالتك في كل برنامج.</div></div><button class="btn" data-tab="list">جميع التخصصات ${ICON.arrow}</button></div>`;
}

function viewList(all){
  const u = S.ui, list = filtered(all), shown = list.slice(0, u.limit || 40);
  return `
  <div class="note" style="margin-bottom:14px">هذه الواجهة لمن يرغب بالاختيار بنفسه: جميع برامج الدليل مع توضيح حالتك في كل برنامج.</div>
  <div class="filters no-print">
    <input class="input search" placeholder="ابحث باسم التخصص أو الرمز أو المؤسسة…" data-ui="q" value="${esc(u.q)}">
    <select class="input" data-ui="field"><option value="">كل المسارات</option>${FIELDS.map(f=>`<option value="${f.key}" ${u.field===f.key?'selected':''}>${f.label}</option>`).join('')}</select>
    <select class="input" data-ui="kind"><option value="">كل أنواع البرامج</option>${KINDS.map(k=>`<option ${u.kind===k?'selected':''}>${k}</option>`).join('')}</select>
    <select class="input" data-ui="status">${[['eligible','المستوفاة فقط'],['near','القريبة فقط'],['reach','المستوفاة والقريبة'],['all','جميع البرامج']].map(([v,l])=>`<option value="${v}" ${u.status===v?'selected':''}>${l}</option>`).join('')}</select>
    <select class="input" data-ui="sort">${[['comp','الأعلى معدلاً تنافسياً'],['req','الأعلى شرطاً']].map(([v,l])=>`<option value="${v}" ${u.sort===v?'selected':''}>${l}</option>`).join('')}</select>
  </div>
  <div class="muted small" style="margin-bottom:10px">${list.length.toLocaleString('ar-OM')} برنامج</div>
  <div class="list">${shown.map(x=>progCard(x.p,x.e)).join('') || '<div class="empty card">لا توجد برامج مطابقة. جرّب تغيير عوامل التصفية.</div>'}</div>
  ${list.length > shown.length ? `<div style="text-align:center;margin-top:16px"><button class="btn" data-act="more">عرض المزيد (${(list.length-shown.length).toLocaleString('ar-OM')})</button></div>` : ''}`;
}
function viewFavs(all){
  const byCode = Object.fromEntries(all.map(x=>[x.p.c,x]));
  const favs = S.favs.map(c=>byCode[c]).filter(Boolean);
  if (!favs.length) return '<div class="empty card">لم تضف أي برنامج بعد. اضغط ☆ على أي برنامج لإضافته إلى قائمة رغباتك.</div>';
  return `<div class="note" style="margin-bottom:14px">رتّب رغباتك حسب الأفضلية كما ستسجلها في نظام القبول الموحد. يعطيك النظام أفضل اختيار تستحقه، فضع ما تريده أولاً، ونوّع بين برامج معدلك فيها مرتفع.</div>
  <div class="card">${favs.map((x,i)=>`<div class="fav-row"><span class="rank">${(i+1).toLocaleString('ar-OM')}</span>
    <div><b>${esc(x.p.n)}</b> <span class="code">${x.p.c}</span><div class="small muted">${esc(x.p.d||x.p.i)} · ${STATUS[x.e.status].l} · المعدل التنافسي ${fmt(x.e.comp)}</div></div>
    <div style="display:flex;gap:4px" class="no-print"><button class="btn sm" data-move="${i}" data-dir="-1" ${i===0?'disabled':''} aria-label="أعلى">▲</button><button class="btn sm" data-move="${i}" data-dir="1" ${i===favs.length-1?'disabled':''} aria-label="أسفل">▼</button><button class="btn sm ghost" data-fav="${x.p.c}" aria-label="حذف">✕</button></div></div>`).join('')}</div>`;
}

/* --- تخصصات الصف العاشر --- */
const pctAr = n => n.toLocaleString('ar-OM') + '٪';
const isAnyMath = sl => sl.length === 2 && sl.includes('math_adv') && sl.includes('math_basic');
const slotLabel = sl => isAnyMath(sl) ? 'الرياضيات (الأساسية أو المتقدمة)' : sl.map(k => SUBJECT_LABEL[k]).join(' أو ');
const COUNT_WORD = {1:'مادة واحدة', 2:'مادتين', 3:'ثلاث مواد'};
function reqRows(p){
  return (p.r || []).flatMap(g => g.k >= g.s.length
    ? g.s.map(sl => ({label: slotLabel(sl), pct: g.m}))
    : [{label: g.s.map(slotLabel).join('، '), pct: g.m, note: 'يكفي ' + (COUNT_WORD[g.k] || g.k) + ' من هذه المواد'}]);
}
function reqTable(p){
  const rows = reqRows(p);
  if (p.o) rows.unshift({label:'المعدل العام في دبلوم التعليم العام', pct:p.o, overall:true});
  if (!rows.length) return '<div class="small muted">النجاح في دبلوم التعليم العام. راجع الدليل الرسمي لتفاصيل هذا البرنامج.</div>';
  return `<div class="rq">${rows.map(r => `<div class="rq-row ${r.overall?'overall':''}">
    <span>${esc(r.label)}${r.note?`<small class="muted">${r.note}</small>`:''}</span>
    <span class="track"><i style="width:${r.pct}%"></i></span>
    <b>${pctAr(r.pct)}${r.pct===50?' <small class="muted">نجاح</small>':''}</b></div>`).join('')}</div>`;
}
function metaPills(p){
  return `<span class="code">${p.c}</span><span class="pill">${esc(p.d || p.i)}</span>${p.co?`<span class="pill">${esc(p.co)}</span>`:''}<span class="pill" style="background:color-mix(in srgb,${fcol(p.f)} 14%,transparent);color:${fcol(p.f)}">${esc((FIELD[p.f]||{}).label||'')}</span>${p.l?`<span class="pill">الدراسة: ${esc(p.l)}</span>`:''}${p.g?`<span class="pill">${p.g==='M'?'للذكور':'للإناث'}</span>`:''}${p.x?'<span class="pill accent">مقابلة / اختبار قبول</span>':''}`;
}
function exploreCard(p, withMatch){
  const fav = S.favs.includes(p.c), m = withMatch ? fieldMatch(p.f) : null;
  return `<article class="card prog" style="--c:${fcol(p.f)}">
    <div class="prog-head">
      <div><h3>${esc(p.n)}</h3><div class="meta">${metaPills(p)}</div></div>
      <button class="btn sm ${fav?'primary':''}" style="flex:none" data-fav="${p.c}">${fav?'✓ تم اختياره':'اختر هذا التخصص'}</button>
    </div>
    <h4 class="rq-title">المواد المطلوبة والنسبة في كل مادة</h4>
    ${reqTable(p)}
    <div class="score">${m!=null?`<span>توافق الميول: <b>${m}%</b></span>`:''}${p.t&&p.t.length?`<span>حسم التعادل: ${p.t.map(k=>SUBJECT_LABEL[k]).join('، ')}</span>`:''}</div>
  </article>`;
}
function fieldTopSubjects(key){
  const ps = PROGRAMS.filter(p => p.f === key && p.r), cnt = {};
  ps.forEach(p => { const seen = new Set(); p.r.forEach(g => g.s.forEach(sl => sl.forEach(k => {
    if (k === 'math_basic' || isAnyMath(sl)) return; // أي رياضيات مقبولة
    seen.add(k); }))); seen.forEach(k => cnt[k] = (cnt[k]||0)+1); });
  return Object.entries(cnt).filter(([k]) => !['english','arabic','islamic'].includes(k)).sort((a,b) => b[1]-a[1]).slice(0,4)
    .map(([k,c]) => ({label: SUBJECT_LABEL[k], pct: Math.round(c/ps.length*100)}));
}
const availableToGender = p => !(p.g && S.gender && p.g !== S.gender);
function sugCard(r, on, star, ringVal, ringTitle, sub, meta){
  return `<button class="card path sug ${on?'on':''}" style="--c:${fcol(r.f.key)}" data-sug="${r.f.key}">
    <span class="path-top"><span class="fi">${ficon(r.f.key)}</span><span style="flex:1;min-width:0;display:block">${star||sub?`<span class="muted small">${star?'⭐ ':''}${sub}</span>`:''}<h3>${r.f.label}</h3>
      <span class="meta">${meta}</span></span>
      <span class="ring" style="--p:${ringVal}" title="${ringTitle}"><span>${ringVal}%</span></span></span>
  </button>`;
}
function moreBtn(total, shown){
  return total > shown ? `<div style="text-align:center;margin-top:16px"><button class="btn" data-act="more">عرض المزيد (${(total-shown).toLocaleString('ar-OM')})</button></div>` : '';
}
function exploreSuggest(){
  if (!hasInterest()) return `<div class="empty card">أكمل اختبار الميول أولاً لنقترح لك التخصصات الأقرب.<div style="margin-top:14px"><button class="btn primary" data-go="interest">إلى اختبار الميول</button></div></div>`;
  const rows = FIELDS.filter(f => f.key !== 'other').map(f => ({f, m: fieldMatch(f.key) ?? 0, n: PROGRAMS.filter(p => p.f === f.key && availableToGender(p)).length}))
    .filter(r => r.n).sort((a,b) => b.m - a.m).slice(0,3);
  const cur = rows.find(r => r.f.key === S.ui.sug) || rows[0];
  const list = PROGRAMS.filter(p => p.f === cur.f.key && availableToGender(p)).sort((a,b) => (b.o??0) - (a.o??0));
  const shown = list.slice(0, S.ui.limit || 40), top = fieldTopSubjects(cur.f.key);
  return `<h2 style="margin:0 0 12px">مساراتك المقترحة</h2>
  <div class="grid g3">${rows.map(r => sugCard(r, r === cur, true, r.m, 'توافق المسار مع ميولك', r.f.riasec.split('').map(k=>RIASEC[k].short).join(' / '), `<span class="pill">${r.n.toLocaleString('ar-OM')} تخصص</span>`)).join('')}</div>
  <h2 style="margin:26px 0 6px">تخصصات مسار ${cur.f.label}</h2>
  ${top.length ? `<div class="chips" style="margin-bottom:14px"><span class="small muted">أكثر المواد المطلوبة:</span>${top.map(t=>`<span class="pill brand">${t.label} · ${t.pct}%</span>`).join('')}</div>` : ''}

function studyPlan(ps){
  const plan = {};
  const add = (key, label, pct, must, code) => {
    const r = plan[key] || (plan[key] = {key, label, max:0, must:new Set(), any:new Set()});
    r.max = Math.max(r.max, pct); r.any.add(code); if (must) r.must.add(code);
  };
  ps.forEach(p => (p.r || []).forEach(g => g.s.forEach(sl => {
    const must = g.k >= g.s.length && (sl.length === 1 || isAnyMath(sl));
    if (isAnyMath(sl)) add('math_any', slotLabel(sl), g.m, must, p.c);
    else sl.forEach(k => add(k, SUBJECT_LABEL[k], g.m, must, p.c));
  })));
  return Object.values(plan).sort((a,b) => (ELECTIVE_KEYS.includes(b.key) - ELECTIVE_KEYS.includes(a.key)) || b.must.size - a.must.size || b.any.size - a.any.size);
}
function planTable(ps){
  const plan = studyPlan(ps);

    title:hello()+gx('أنت ','أنتِ ')+p[0],
    body:p[1]+' '+gx('ويساندك في ذلك جانبك ','ويساندكِ في ذلك جانبكِ ')+RIASEC[b].name+'.',
    foot:gx('ثق بنفسك؛ ما تملكه اليوم هو نقطة البداية، وما ستبنيه بجهدك وإصرارك أكبر مما تتخيل. أنت قادر على الوصول.','ثقي بنفسكِ؛ ما تملكينه اليوم هو نقطة البداية، وما ستبنينه بجهدكِ وإصراركِ أكبر مما تتخيلين. أنتِ قادرة على الوصول.'),
    cta:gx('اعرض تخصصاتي','اعرضي تخصصاتي'), stay:gx('مراجعة إجاباتي','مراجعة إجاباتي')};
}
function msgSubjectsDone(){
  const subs = studentSubjects().length;
  return {icon:'chart', color:'#12b886', kicker:gx('اختيار موفق','اختيار موفق'),
    title:hello()+gx('موادك جاهزة وهي متوافقة مع الضوابط','موادكِ جاهزة وهي متوافقة مع الضوابط'),
    body:gx('أحسنت! اختيار المواد قرار مهم، وقد أنجزته بوعي. بقيت خطوة واحدة.','أحسنتِ! اختيار المواد قرار مهم، وقد أنجزتِه بوعي. بقيت خطوة واحدة.'),
    steps:[['أدخل درجاتك في '+subs.toLocaleString('ar-OM')+' مواد', S.grade==='12'?'درجات الصف الثاني عشر الفعلية أو المتوقعة.':'درجاتك الحالية أو المتوقعة.'],['راقب معدلك العام','يتحدّث مباشرة مع كل درجة تدخلها.']],
    cta:'إلى درجاتي'};
}
function msgGradesDone(){
  const all = evalAll(), avg = overallAvg();
  const el = all.filter(x => x.e.status === 'eligible').length, nr = all.filter(x => x.e.status === 'near').length;
  const tier = avg >= 90
    ? [gx('نتائجك مبهرة، وأنت تستحق الفخر بها','نتائجكِ مبهرة، وأنتِ تستحقين الفخر بها'), gx('هذا المستوى ثمرة جهد وانضباط. استمر بالروح نفسها، فالأبواب أمامك واسعة.','هذا المستوى ثمرة جهد وانضباط. استمري بالروح نفسها، فالأبواب أمامكِ واسعة.')]
    : avg >= 75
    ? [gx('أداؤك قوي، وأنت على الطريق الصحيح','أداؤكِ قوي، وأنتِ على الطريق الصحيح'), gx('ما حققته لم يأتِ صدفة. كل نقطة تضيفها الآن تفتح لك خيارات أكثر.','ما حققتِه لم يأتِ صدفة. كل نقطة تضيفينها الآن تفتح لكِ خيارات أكثر.')]
    : avg >= 60
    ? [gx('لديك أساس جيد تبني عليه','لديكِ أساس جيد تبنين عليه'), gx('الطريق مفتوح أمامك، وتحسين درجاتك في مواد محددة قد يغيّر خياراتك كثيراً. أنت قادر على ذلك.','الطريق مفتوح أمامكِ، وتحسين درجاتكِ في مواد محددة قد يغيّر خياراتكِ كثيراً. أنتِ قادرة على ذلك.')]
    : [gx('درجاتك اليوم ليست نهاية الطريق','درجاتكِ اليوم ليست نهاية الطريق'), gx('كثير من الناجحين بدأوا من هنا. ركّز على مادة واحدة كل مرة، وستفاجئك النتائج.','كثير من الناجحين بدأوا من هنا. ركّزي على مادة واحدة كل مرة، وستفاجئكِ النتائج.')];
  return {icon:'target', color:'#ffb020', confetti: avg >= 60, kicker:gx('أحسنت، أنجزت كل البيانات','أحسنتِ، أنجزتِ كل البيانات'),
    title:hello()+tier[0], body:tier[1],
    extra:`<div class="msg-stats"><div><b>${fmt(avg)}%</b><small>المعدل العام</small></div><div><b style="color:var(--ok)">${el.toLocaleString('ar-OM')}</b><small>برنامج تستوفي شروطه</small></div><div><b style="color:var(--warn)">${nr.toLocaleString('ar-OM')}</b><small>برنامج قريب منك</small></div></div>`,
    foot:gx('ثق بنفسك، فالقرار الذي تبنيه على معرفة هو بداية نجاحك.','ثقي بنفسكِ، فالقرار الذي تبنينه على معرفة هو بداية نجاحكِ.'),
    cta:gx('اعرض تخصصاتي','اعرضي تخصصاتي')};
}
const GATES = {
  'home>me': () => once('welcome', msgWelcome),
  'interest>results': () => hasInterest() ? once('praise:'+topCode().join(''), msgInterestDone) : null,
  'subjects>grades': () => once('subj:'+S.grade+JSON.stringify(curSet()), msgSubjectsDone),
  'grades>results': () => once('gr:'+S.grade+Math.round(overallAvg()), msgGradesDone),
};
function gated(to){
  const g = GATES[S.step+'>'+to], m = g && g();
  if (m) showMsg(m, () => go(to)); else go(to);
}
function pickGrade(v){
  S.grade = v; Object.assign(S.ui, {tab:'paths', field:'', sug:'', status:'all', limit:40});
  const to = v === '10' ? 'interest' : 'subjects';
  const m = once('pick'+v, v === '10' ? msgPick10 : msgPickUpper);
  if (m) { render(); showMsg(m, () => go(to)); } else go(to);
}

/* ============ الأحداث ============ */
document.addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.msg) return closeMsg(d.msg === 'ok');
  if (d.go) return d.gate ? gated(d.go) : go(d.go);
  if (d.pick) return pickGrade(d.pick);
  if (d.set) { S[d.set] = d.val; return render(); }
  if (d.ans != null) {
    const before = answeredCount(); S.answers[d.ans] = +d.val; keep(render);
    const n = answeredCount();
    if (n !== before && n === QUESTIONS.length) gated('results');
    else if (n !== before && CHEERS[n]) toast(CHEERS[n]);
    return;
  }
  if (d.env) { const i = S.envPick.indexOf(d.env); i>=0 ? S.envPick.splice(i,1) : S.envPick.push(d.env); return keep(render); }
  if (d.math) { S[d.math].math = d.val; return keep(render); }
  if (d.el) {
    const set = S[d.el], i = set.el.indexOf(d.val);
    if (i >= 0) set.el.splice(i,1); else if (set.el.length < 3) set.el.push(d.val); else toast('يمكنك اختيار ثلاث مواد اختيارية فقط. أزل مادة أولاً.');
    return keep(render);
  }
  if (d.tab) { S.ui.tab = d.tab; S.ui.limit = 40; return render(); }
  if (d.sug) { S.ui.sug = d.sug; S.ui.limit = 40; return keep(render); }
  if (d.fav) { const i = S.favs.indexOf(d.fav); if (i>=0) S.favs.splice(i,1); else { S.favs.push(d.fav); toast(S.grade === '10' ? 'أضيف إلى اختياراتي' : 'أضيف إلى رغباتي'); } return keep(render); }
  if (d.move != null) { const i=+d.move, j=i+(+d.dir); [S.favs[i],S.favs[j]]=[S.favs[j],S.favs[i]]; return keep(render); }
  const act = d.act;
  if (act === 'more') { S.ui.limit = (S.ui.limit||40) + 40; return keep(render); }
  if (act === 'print') return window.print();
  if (act === 'reset') { if (confirm('سيتم مسح جميع بياناتك من هذا الجهاز. هل أنت متأكد؟')) { S = blank(); render(); } return; }
  if (act === 'export') {
    const blob = new Blob([JSON.stringify(S, null, 1)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'masari-'+(S.name||'student')+'.json'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1000); return;
  }
  if (act === 'import') {
    const inp = document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
    inp.onchange = () => { const f = inp.files[0]; if (!f) return; f.text().then(t => { try { S = Object.assign(blank(), JSON.parse(t)); render(); toast('تمت استعادة نسختك'); } catch(e){ toast('تعذّر قراءة الملف'); } }); };
    inp.click(); return;
  }
});
document.addEventListener('keydown', ev => {
  const el = document.getElementById('msg');
  if (!el.classList.contains('show')) return;
  if (ev.key === 'Escape') return closeMsg(false);
  if (ev.key === 'Tab') { // إبقاء التركيز داخل الرسالة
    const bs = [...el.querySelectorAll('button')], i = bs.indexOf(document.activeElement);
    ev.preventDefault(); bs[(i + (ev.shiftKey ? bs.length - 1 : 1)) % bs.length].focus();
  }
});
function keep(fn){ const y = window.scrollY; fn(); window.scrollTo(0,y); }
document.addEventListener('input', ev => {
  const t = ev.target, d = t.dataset;
  if (d.bind) { S[d.bind] = t.value; save(); if (d.bind==='name') renderChrome(); return; }
  if (d.grade) {
    let v = t.value; if (v !== '') v = Math.max(0, Math.min(100, +v));
    S.grades[d.grade] = v;
    document.querySelectorAll(`[data-grade="${d.grade}"]`).forEach(x => { if (x !== t) x.value = v === '' ? 70 : v; });
    const avg = overallAvg(); const o = document.getElementById('avg-out'); if (o) o.textContent = fmt(avg) + (avg!=null?'%':'');
    const nb = document.querySelector('.nav .btn.primary'); if (nb) nb.disabled = avg == null;
    save(); renderChrome(); return;
  }
  if (d.ui === 'q') { S.ui.q = t.value; S.ui.limit = 40; clearTimeout(window._qt); window._qt = setTimeout(()=>{ keep(render); const s=document.querySelector('[data-ui="q"]'); if (s){ s.focus(); s.setSelectionRange(s.value.length,s.value.length);} }, 250); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.ui && t.dataset.ui !== 'q') { S.ui[t.dataset.ui] = t.value; S.ui.limit = 40; keep(render); }
});
render();
</script>
</body>
</html>
